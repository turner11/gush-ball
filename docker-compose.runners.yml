services:
  runner-claude:
    build:
      context: .
      dockerfile: .docker/runner-claude/Dockerfile
    environment:
      - RUNNER_SCOPE=repo
      - REPO_URL=https://github.com/turner11/gush-ball
      # 1h registration token minted by run-claude-runner.sh; the PAT never enters the container.
      - RUNNER_TOKEN=${RUNNER_TOKEN:?run ./run-claude-runner.sh, it mints this}
      - RUNNER_NAME=gush-ball-claude-agent
      - LABELS=self-hosted,Linux,X64,claude-agent
      - EPHEMERAL=1                              # one job, then the runner exits
      - RUN_AS_ROOT=false                        # jobs run as `runner`
      - UNSET_CONFIG_VARS=true                   # entrypoint drops the token before the listener starts
      - DISABLE_AUTOMATIC_DEREGISTRATION=true    # GitHub removes an ephemeral runner itself
    # No `restart:`; a restart reuses the writable layer. run-claude-runner.sh starts a fresh container per job.

# start (dev machine only, never the prod host): ./run-claude-runner.sh
# stop: Ctrl-C

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gush_ball
      POSTGRES_PASSWORD: gush_ball
      POSTGRES_DB: gush_ball
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Full local stack: `docker compose --profile full up -d --build`
  backend:
    profiles: [full]
    build: ./backend
    depends_on: [db]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://gush_ball:gush_ball@db:5432/gush_ball
      SESSION_SECRET: local-dev-only-not-a-real-secret-0123456789
      # ponytail: no object-storage vars, so /uploads fails locally until R2 vars are set
  web:
    profiles: [full]
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8081:80"

volumes:
  db_data:

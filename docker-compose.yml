services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gush_ball
      POSTGRES_PASSWORD: gush_ball
      POSTGRES_DB: gush_ball
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Full local stack: `docker compose --profile full up -d --build`
  backend:
    profiles: [full]
    build:
      context: ./backend
      additional_contexts:
        stats: ./stats
    depends_on: [db]
    restart: unless-stopped
    # R2 creds etc. come from backend/.env (dockerignored, so it must be passed here).
    # `environment` below wins over it, keeping DATABASE_URL pointed at the compose db.
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gush_ball:gush_ball@db:5432/gush_ball
      SESSION_SECRET: local-dev-only-not-a-real-secret-0123456789
  web:
    profiles: [full]
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8081:80"

  # BBStats Streamlit app, for debugging: `docker compose --profile stats up stats`
  stats:
    profiles: [stats]
    image: python:3.12-slim
    working_dir: /stats
    volumes:
      - ./stats:/stats
    command: >
      sh -c "pip install -q -e '.[app]' &&
             streamlit run src/apps/stats.py --server.address 0.0.0.0 --server.headless true"
    ports:
      - "8501:8501"

  # pgAdmin for exploring the local db: `docker compose --profile pgadmin up -d pgadmin`
  pgadmin:
    profiles: [pgadmin]
    image: dpage/pgadmin4
    depends_on: [db]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: no pgAdmin login screen (local only).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    ports:
      - "5050:80"

configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {"Name": "gush_ball (local)", "Group": "Servers", "Host": "db", "Port": 5432,
        "MaintenanceDB": "gush_ball", "Username": "gush_ball", "SSLMode": "prefer"}}}

volumes:
  db_data:

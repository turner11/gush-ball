# Render Blueprint — infra-as-code for Gush Ball's Postgres + backend + frontend.
# See README.md "## Deployment" for what's a secret vs. blueprint-generated, and the
# one-time manual steps (account creation, secrets, deploy hooks, URL patch-up) a human
# admin still has to do after this file is applied.

databases:
  - name: gush-ball-db
    plan: free

services:
  - type: web
    name: gush-ball-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --all-groups --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gush-ball-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Placeholder — admin fills in the real frontend URL once it's known (see README).
        value: '["https://gush-ball-frontend.onrender.com"]'
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false

  - type: web
    name: gush-ball-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      # Proxy first: reverse-proxies /api/* so the frontend's existing relative,
      # cookie-bearing fetch() calls keep working same-origin in production.
      - type: rewrite
        source: /api/*
        # Placeholder — admin fills in the real backend URL once it's known (see README).
        destination: https://gush-ball-backend.onrender.com/:splat
      # SPA fallback for Vue Router's createWebHistory (frontend/src/router/index.js).
      - type: rewrite
        source: /*
        destination: /index.html

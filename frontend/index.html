<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c1830" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta name="public-url" content="{{env "PUBLIC_URL"}}" />
    <meta name="club-domains" content="{{env "CLUB_DOMAINS" | html}}" />
    {{with httpInclude (print "/api/og?path=" (urlquery .OriginalReq.URL.Path))}}{{.}}{{else}}
    <title>כדורסל ישראל · משחקים, תוצאות וטבלאות ליגה</title>
    <meta name="description" content="GushBall: משחקים ותוצאות, טבלת הליגה, שחקנים, חדשות ומדיה של קבוצות המועדון." />
    <meta property="og:title" content="כדורסל ישראל · משחקים, תוצאות וטבלאות ליגה" />
    <meta property="og:description" content="משחקים ותוצאות, טבלת הליגה, שחקנים, חדשות ומדיה של קבוצות המועדון." />
    <meta property="og:image" content="{{env "PUBLIC_URL"}}/logo.jpg" />
    <meta property="og:site_name" content="GushBall" />
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "GushBall", "url": "{{env "PUBLIC_URL"}}/" }
    </script>
    {{end}}
    <meta property="og:locale" content="he_IL" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>האתר מתעדכן</title>
<style>
:root {
  color-scheme: light;
  --surface: #f3f4f7; --raised: #ffffff; --ink: #0c1830; --muted: #505a6b; --line: #dde1e8;
  --team-default: #0c1830; --team-on-default: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #070d1a; --raised: #0f1a2e; --ink: #eef1f6; --muted: #9aa6b8; --line: #1f2d47;
    --team-default: #eef1f6; --team-on-default: #0c1830;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #070d1a; --raised: #0f1a2e; --ink: #eef1f6; --muted: #9aa6b8; --line: #1f2d47;
  --team-default: #eef1f6; --team-on-default: #0c1830;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center; padding-inline: 1rem;
  background: var(--surface); color: var(--ink);
  font-family: "Segoe UI", "Arial Hebrew", Arial, system-ui, sans-serif;
}
main {
  width: 100%; max-width: 32rem; margin-block: 1rem; padding: 1.5rem; text-align: center;
  background: var(--raised); border: 1px solid var(--line); border-radius: 1rem;
}
main[hidden] { display: none; }
h1 { margin: 0.5rem 0; font-size: 2.5rem; font-weight: 900; line-height: 1.1; }
#generic h1 { font-size: 1.75rem; }
p { margin: 0.5rem 0; line-height: 1.6; }
.muted { color: var(--muted); font-size: 0.875rem; }
.eyebrow { margin: 0.5rem 0 0; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; }
.logo { width: 64px; height: 64px; border-radius: 0.75rem; }
.ball { display: block; width: 96px; height: 96px; margin: 0.5rem auto; animation: bounce 1s ease-in infinite alternate; }
@keyframes bounce { from { transform: translateY(-14px); } to { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 1rem;
  padding-inline: 1.5rem; border-radius: 0.5rem; font-weight: 600; text-decoration: none;
  background: var(--team-default); color: var(--team-on-default);
}
.btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (max-width: 479px) { .btn { display: flex; width: 100%; } }
</style>
</head>

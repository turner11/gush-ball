[project]
name = "gush-ball-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "bbstats",
    "bcrypt>=4.1",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.40.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "opencv-python-headless>=4.10,<6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
bbstats = { path = "../stats", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

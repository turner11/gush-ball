x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:17-alpine
    container_name: gush-ball-db  # stable name for backup.sh / dbsync.sh (docker exec)
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: gush_ball
      POSTGRES_DB: gush_ball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      additional_contexts:
        stats: ./stats
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql+psycopg://gush_ball:${POSTGRES_PASSWORD:?}@db:5432/gush_ball
      SESSION_SECRET: ${SESSION_SECRET:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      STATS_URL: ${STATS_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
    depends_on:
      - db

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    # No published ports: Coolify's proxy routes the domain to this container's port 80 and
    # terminates TLS.
    depends_on:
      - backend

volumes:
  db_data:

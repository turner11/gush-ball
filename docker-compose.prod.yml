x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: gush_ball
      POSTGRES_DB: gush_ball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      - db

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:

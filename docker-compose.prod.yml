x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    # No container_name: Coolify ignores it and names this db-<resource-id>-<deploy-timestamp>. Scripts match the
    # stable db-<resource-id> prefix (dbsync.sh, pull_prod_db.py).
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: gush_ball
      POSTGRES_DB: gush_ball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      additional_contexts:
        stats: ./stats
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql+psycopg://gush_ball:${POSTGRES_PASSWORD:?}@db:5432/gush_ball
      SESSION_SECRET: ${SESSION_SECRET:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      STATS_URL: ${STATS_URL:-}
      STATS_TEMPLATE_URL: ${STATS_TEMPLATE_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *logging
    # No published ports: Coolify's proxy routes the domain to this container's port 80 and
    # terminates TLS.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?}  # absolute og:image / robots.txt Sitemap (Caddy templates)
    depends_on:
      - backend

  # Nightly pg_dump to the private R2 backup bucket (BACKUP.md section 3). Logs: Coolify -> this service.
  backup:
    build: ./backup
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: auto
    depends_on:
      - db

volumes:
  db_data:

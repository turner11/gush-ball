version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: uv
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # OpenCV 5 drops cv2.CascadeClassifier, which scrape_games.py's face centring uses.
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/.docker/runner-claude"]
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
